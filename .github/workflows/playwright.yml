name: 🎭 Playwright

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: 🧪 Copy test env vars
        run: cp apps/web/.env.example apps/web/.env

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🌐 Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: 🧳 Cache Turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 📥 Install dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: 📥 Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      # The dev server the tests run against imports the built workspace
      # packages. Building them here rather than letting `dev:web` race its own
      # `tsdown --watch` tasks keeps the server's startup within Playwright's
      # `webServer` timeout on a cold runner.
      - name: 🏗️ Build workspace packages
        run: pnpm run build:packages

      - name: 🎭 Run Playwright tests
        run: pnpm run test:e2e

      - name: 📊 Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: packages/playwright/playwright-report/
          retention-days: 30
