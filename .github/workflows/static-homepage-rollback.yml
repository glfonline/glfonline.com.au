name: 🧊 Static homepage rollback

# Rolls the target back to the Phase 1 SSR homepage (edge-cached by the Worker) at a given SHA.
# It pauses the coordinator first so nothing redeploys the static page, and leaves it paused.
# Resume is a separate, manual step (see docs/static-homepage.md).
# The SHA must contain the static homepage pipeline (it writes __content.json); use the last good
# commit on main that includes it, or this PR's merge commit.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (production only from main)
        required: true
        type: choice
        options:
          - staging
          - production
      sha:
        description: Commit to build in SSR mode
        required: true
        type: string

concurrency:
  group: static-homepage-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: ⏪ Roll back to SSR (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      SHA: ${{ inputs.sha }}
      STATIC_COORD_URL: ${{ vars.STATIC_COORD_URL }}
      STATIC_PUBLIC_ORIGIN: ${{ vars.STATIC_PUBLIC_ORIGIN }}
      # Secrets are scoped to the single steps that need them (never install or the generic build).
    steps:
      - name: 🛡️ Guard target
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::target=production is only allowed from main (ref: ${{ github.ref }})"
          exit 1

      # Tooling comes from the dispatched ref, the app from the SHA being rolled back to.
      - name: 📥 Checkout tooling
        uses: actions/checkout@v7
        with:
          path: tooling
          # Full history so the SHA's ancestry on the dispatched ref can be checked.
          fetch-depth: 0

      - name: 🔎 Verify SHA is on the dispatched ref
        working-directory: tooling
        run: |
          git cat-file -e "${SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$SHA"
          if ! git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"; then
            echo "::error::sha ${SHA} is not on the dispatched ref"
            exit 1
          fi

      - name: 📥 Checkout app at SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          path: app

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - name: 🛠️ Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: app/package.json
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: ⏸️ Pause the coordinator
        env:
          STATIC_COORD_ADMIN_TOKEN: ${{ secrets.STATIC_COORD_ADMIN_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            -X POST "${STATIC_COORD_URL%/}/admin/pause" \
            -H "Authorization: Bearer ${STATIC_COORD_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"reason\":\"rollback to ssr at ${SHA} (${GITHUB_RUN_ID})\"}"
          echo

      - name: 🚚 Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # SENTRY_AUTH_TOKEN is needed here for source map upload; the Cloudflare credentials are not.
      - name: 🏗️ Build (SSR mode, GLF_STATIC_HOMEPAGE unset)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node tooling/scripts/static-homepage/build.mjs --mode ssr --repo-root app --code-sha "$SHA" --work-dir "$RUNNER_TEMP/static-homepage"

      - name: 🚀 Deploy
        working-directory: app
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node ../tooling/scripts/static-homepage/deploy-config.mjs --target "$TARGET" --build-dir apps/web/build --out "$RUNNER_TEMP/wrangler.deploy.json"
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" pnpm --filter @glfonline/web exec wrangler deploy --config "$RUNNER_TEMP/wrangler.deploy.json" --message "rollback to ssr at ${SHA:0:12}"

      - name: ✅ Verify Phase 1 SSR is live
        run: |
          ORIGIN=$(node tooling/scripts/static-homepage/targets.mjs "$TARGET" origin)
          for attempt in 1 2 3 4 5 6; do
            if node tooling/scripts/static-homepage/verify-live.mjs --origin "$ORIGIN" --mode ssr --code-sha "$SHA"; then exit 0; fi
            echo "verification attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 📝 Reminder
        if: success()
        run: |
          {
            echo "## Rolled back to SSR"
            echo "- Target: \`${TARGET}\`, SHA: \`${SHA}\`"
            echo "- The coordinator is **paused**. Fix the cause, then resume: \`POST /admin/resume\` (see docs/static-homepage.md)."
          } >> "$GITHUB_STEP_SUMMARY"
